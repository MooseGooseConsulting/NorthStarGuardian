name: Guardian Debt Sweep

on:
  schedule:
    # Run daily at 12:00 UTC.
    - cron: "0 12 * * *"
  # Allow manual trigger for testing.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sweep-debt:
    name: Sweep Debt Timers
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.CI_FORCE_HOSTED == 'true') && 'ubuntu-latest' || 'moosegoose-linux' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install NorthStarGuardian
        run: pip install -e ".[dev]"

      - name: Run debt sweep
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: guardian sweep-debt
