# NorthStarGuardian - Consumer Workflow Example
#
# Copy this file into your own repository at:
#   .github/workflows/guardian.yml
#
# Prerequisites:
#   1. Add OPENAI_API_KEY to repository secrets.
#   2. Add LINEAR_API_KEY for trusted slash-command amendments when north_star.source is "linear".
#   3. Keep the human-facing North Star at docs/northstar.md.
#   4. Commit .github/guardian/guardian-config.json with your Guardian config.

name: Guardian

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  interview:
    name: PR Interview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          # Full history lets Guardian read docs/northstar.md from the PR base SHA.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Guardian
        run: pip install northstar-guardian

      - name: Interview PR
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::Skipping Guardian interview because OPENAI_API_KEY is not configured."
            exit 0
          fi
          guardian interview

  command:
    name: Slash Command
    if: >-
      github.event_name == 'issue_comment' &&
      startsWith(github.event.comment.body, '/') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Guardian
        run: pip install northstar-guardian

      - name: Dispatch slash command
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: guardian command
